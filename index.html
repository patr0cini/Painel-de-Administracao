<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="adaptador.js"></script>
<title>Painel da Administração</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout: menu lateral Verde-noite fixo à esquerda, conteúdo em cartões sobre fundo Erva-claro; em telemóvel o menu passa para cima. */
:root{
  --verde:#91B03E; --verde-esc:#5C7A1F; --verde-txt:#4E6B16; --noite:#1E2B19; --noite-txt:#E6ECDA; --noite-mute:#B9C6A6; --noite-off:#9DAA8A;
  --fundo:#F4F6EF; --cartao:#FFFFFF; --poco:#F4F6EF; --erva:#EDF2E0; --linha:#DDE3D2; --linha-fina:#EEF1E8; --borda-ctl:#C9D2B8;
  --txt:#22281C; --mute:#5A5B5D; --ok:#3E6A12; --aviso:#8A3F06; --aviso-bg:#FCEBDD; --aviso-linha:#B4540A;
  --info:#1F4F80; --info-bg:#E3EEF8; --neutro-bg:#E8E9EA; --neutro-txt:#3F4042; --barra:#E7ECDD; --serie2:#2F4409;
  --prim:#4E6B16; --cel:#F7F9F3; --ft:'Jost','Trebuchet MS',sans-serif; --fb:'Source Sans 3','Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --verde:#91B03E; --verde-esc:#A9C65A; --verde-txt:#B5D06A; --noite:#121A0F; --noite-txt:#E6ECDA; --noite-mute:#A9B796; --noite-off:#7F8C6E;
  --fundo:#171D14; --cartao:#1F271B; --poco:#262F21; --erva:#2B3722; --linha:#35402D; --linha-fina:#2A3325; --borda-ctl:#4A573F;
  --txt:#E9EEDF; --mute:#A8AEA0; --ok:#A9CC66; --aviso:#F0A66A; --aviso-bg:#40280F; --aviso-linha:#E08A45;
  --info:#9CC4EC; --info-bg:#1B2E42; --neutro-bg:#33372F; --neutro-txt:#C9CDC2; --barra:#33402A; --serie2:#D7E6AE; --prim:#5C7A1F; --cel:#232B1F; color-scheme:dark}}
:root[data-theme="dark"]{
  --verde:#91B03E; --verde-esc:#A9C65A; --verde-txt:#B5D06A; --noite:#121A0F; --noite-txt:#E6ECDA; --noite-mute:#A9B796; --noite-off:#7F8C6E;
  --fundo:#171D14; --cartao:#1F271B; --poco:#262F21; --erva:#2B3722; --linha:#35402D; --linha-fina:#2A3325; --borda-ctl:#4A573F;
  --txt:#E9EEDF; --mute:#A8AEA0; --ok:#A9CC66; --aviso:#F0A66A; --aviso-bg:#40280F; --aviso-linha:#E08A45;
  --info:#9CC4EC; --info-bg:#1B2E42; --neutro-bg:#33372F; --neutro-txt:#C9CDC2; --barra:#33402A; --serie2:#D7E6AE; --prim:#5C7A1F; --cel:#232B1F; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--fundo);color:var(--txt);font-family:var(--fb);font-size:15px;line-height:1.4}
h1,h2,h3{font-family:var(--ft);font-weight:500;margin:0;text-wrap:balance}
h1{font-size:34px} h2{font-size:20px} h3{font-size:17px}
a{color:var(--verde-txt)}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--verde-esc);outline-offset:2px}
.app{display:flex;flex-wrap:wrap;min-height:100%}
nav{flex:1 1 220px;max-width:280px;min-width:0;background:var(--noite);color:var(--noite-txt);padding:28px 18px;display:flex;flex-direction:column;gap:28px}
.marca{padding:0 12px;display:flex;flex-direction:column;gap:2px}
.marca b{font-family:var(--ft);font-size:22px;font-weight:600;color:#fff}
.marca span{font-size:13px;color:var(--noite-mute)}
.menu{display:flex;flex-direction:column;gap:4px}
.menu a{display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:0 12px;border-radius:8px;color:var(--noite-txt);text-decoration:none}
.menu a[aria-current="page"]{background:var(--verde);color:#16210F;font-weight:600}
.menu a.off{color:var(--noite-off);cursor:default}
.menu a.off span{font-size:12px}
.rodape{margin-top:auto;padding:0 12px;font-size:13px;color:var(--noite-mute);display:flex;flex-direction:column;gap:10px}
.rodape b{color:#fff;font-weight:600}
.rodape button{min-height:44px;border-radius:8px;border:1px solid var(--verde);background:transparent;color:var(--noite-txt);font-size:14px;cursor:pointer}
main{flex:999 1 560px;min-width:0;padding:32px 40px 48px;display:flex;flex-direction:column;gap:24px}
header.topo{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.sobre{font-size:13px;color:var(--mute)}
.cartao{background:var(--cartao);border:1px solid var(--linha);border-radius:12px;padding:20px 22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.grelha{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.kpi{gap:6px;padding:18px 20px}
.kpi .n{font-family:var(--ft);font-size:28px;font-weight:500;font-variant-numeric:tabular-nums}
.kpi .d{font-size:13px;color:var(--mute)}
.ok{color:var(--ok)!important}.warn{color:var(--aviso)!important}.mute{color:var(--mute)}
.linha2{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.linha2>*{flex:1 1 380px}
.cab{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.cab a{font-size:14px}
.rolo{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{text-align:left;color:var(--mute);font-size:13px;font-weight:600;padding:8px}
td{padding:10px 8px;border-top:1px solid var(--linha-fina);vertical-align:top}
th:first-child,td:first-child{padding-left:0} th:last-child,td:last-child{padding-right:0}
.r{text-align:right}
.cod{color:var(--mute);font-size:13px}
tr.sel td{background:var(--erva)} tr.clic{cursor:pointer}
tr.total td{background:var(--erva);font-weight:600}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:5px;white-space:nowrap}
.t-aviso{background:var(--aviso-bg);color:var(--aviso)} .t-info{background:var(--info-bg);color:var(--info)}
.t-curso{background:var(--erva);color:var(--ok)} .t-fim{background:var(--neutro-bg);color:var(--neutro-txt)}
.alerta{display:flex;gap:12px;align-items:flex-start;padding-bottom:12px;border-bottom:1px solid var(--linha-fina)}
.alerta:last-child{border-bottom:0;padding-bottom:0}
.alerta b{display:block;font-weight:600} .alerta small{font-size:13px;color:var(--mute)}
.orc input[type=text]{min-height:40px;width:132px;height:auto;text-align:right;border-radius:8px;border:1px solid var(--borda-ctl);background:var(--cartao);padding:0 10px;font:inherit;color:inherit;font-variant-numeric:tabular-nums}
.orc input[type=text]:disabled{opacity:.6}
.orc tr.sec td{font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;color:var(--mute,inherit);padding-top:18px}
.orc tr.tot td{background:var(--erva)}
.orc td:first-child{white-space:normal;min-width:200px;max-width:380px}
.orc td:first-child .cod{display:inline-block;line-height:1.35}
.mel p{margin:8px 0 0;max-width:78ch;line-height:1.5}
.cartao>p{margin:8px 0 0;max-width:78ch;line-height:1.5}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button,.ctl{min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--borda-ctl);background:var(--cartao);cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--verde-esc);background:var(--erva);font-weight:600}
.v{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;cursor:pointer;border-bottom:1px dotted var(--borda-ctl);font-variant-numeric:tabular-nums}
.v:hover{border-bottom-color:var(--verde-esc)}
.legenda{display:flex;gap:18px;font-size:13px;color:var(--mute);flex-wrap:wrap}
.legenda i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:4px}
svg text{font-family:var(--fb);fill:var(--mute)}
.vazio{color:var(--mute);font-size:14px;padding:8px 0}
.poco{background:var(--poco);border-radius:10px;padding:12px 14px}
.poco small{display:block;font-size:12px;color:var(--mute)} .poco span{font-family:var(--ft);font-size:20px}
.quatro{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.barra{height:8px;border-radius:4px;background:var(--barra);overflow:hidden} .barra i{display:block;height:8px;background:var(--verde)}
.tipo{display:flex;flex-direction:column;gap:4px}
.tipo .l{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.tipo small{font-size:12px;color:var(--mute)}
.nota{font-size:14px;border-top:1px solid var(--linha-fina);padding-top:8px}
#origem{position:fixed;z-index:20;max-width:min(340px,calc(100vw - 32px));background:var(--cartao);border:1px solid var(--verde-esc);border-radius:12px;padding:16px 18px;box-shadow:0 8px 24px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:6px}
#origem .et{font-size:12px;font-weight:600;color:var(--verde-txt);text-transform:uppercase;letter-spacing:.6px}
#origem .ti{font-family:var(--ft);font-size:18px}
#origem .de{font-size:14px;color:var(--mute);line-height:1.5}
dl{margin:0;display:grid;grid-template-columns:minmax(140px,1fr) 3fr;gap:10px 20px;font-size:14px}
dt{font-weight:600} dd{margin:0;color:var(--mute)}
.pes{display:block;width:100%;text-align:left;min-height:36px;padding:6px 10px;border-radius:8px;border:1px solid var(--linha);background:var(--cartao);font-size:14px;cursor:pointer}
.pes.on{border-color:var(--verde-esc);background:var(--erva)} .semeq .pes{width:auto;border-radius:18px;padding:6px 12px}
.dg{background:var(--noite);color:#fff;border-radius:10px;padding:10px 18px;font-family:var(--ft);font-size:17px;display:flex;flex-direction:column;gap:8px;align-items:center;min-width:220px}
.dg .pes{font-family:var(--fb);color:var(--txt)}
.area{border:1px solid var(--borda-ctl);border-top:4px solid var(--verde);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.ramo{min-width:0;background:var(--poco);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;border:2px solid transparent}
.eq{background:var(--cartao);border:1px solid var(--linha);border-left:6px solid var(--mute);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.semeq{border:1px dashed var(--aviso-linha);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.alvo{outline:2px dashed var(--verde-esc);outline-offset:2px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.campo{display:flex;flex-direction:column;gap:4px;min-width:0} .campo label{font-size:13px;color:var(--mute)}
.campo input,.campo select,.campo textarea{min-height:44px;width:100%;border-radius:8px;border:1px solid var(--borda-ctl);background:var(--cartao);padding:0 10px;font:inherit;color:inherit}
.campo textarea{padding:8px 10px;resize:vertical}
.prim{min-height:44px;padding:0 18px;border-radius:8px;border:0;background:var(--prim);color:#fff;font-weight:600;cursor:pointer}
.cal{display:grid;gap:3px}
.dia{display:flex;flex-direction:column;padding:2px 0;border-radius:4px} .dia.fds{background:var(--linha-fina)} .dia.hoje{background:var(--noite);color:#fff;font-weight:600}
.cel{height:30px;border-radius:4px;background:var(--cel)} .cel.fds{background:var(--linha-fina)}
.cel.ferias,.lg.ferias{background:var(--verde)} .cel.estatuto,.lg.estatuto{background:var(--info)} .cel.lsv,.lg.lsv{background:var(--mute)}
.cel.conf,.lg.conf{background:var(--cartao);border:2px dashed var(--aviso-linha)}
.cel.meio{background:linear-gradient(90deg,var(--verde) 50%,var(--cel) 50%)}
.legenda i.lg{width:14px;height:14px;border-radius:3px;vertical-align:-2px} .lg.fds{background:var(--linha-fina)} .lg.hoje{background:var(--noite)}
code{font-family:ui-monospace,Menlo,monospace;background:var(--poco);padding:1px 6px;border-radius:4px}
.mini{min-height:32px!important;padding:0 10px!important;font-size:13px}
.perigo{border-color:var(--aviso-linha)!important;color:var(--aviso)!important}
.aviso-cx{border:1px solid var(--aviso-linha);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.chk{display:flex;align-items:center;gap:8px;min-height:44px;font-size:14px} .chk input{width:18px;height:18px}
.eqlin{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;border-top:1px solid var(--linha-fina);padding-top:10px}
.nomef{background:none;border:0;padding:0;text-align:left;font:inherit;font-weight:600;font-size:14px;color:inherit;cursor:pointer;text-decoration:underline dotted var(--borda-ctl);text-underline-offset:3px}
.nomef.on{color:var(--verde-txt)} .cel[data-fn]{cursor:pointer} .cel[data-fn]:hover{outline:2px solid var(--verde-esc)}
.cel.baixa,.lg.baixa{background:var(--aviso-linha)}
@media (max-width:760px){
  /* telemóvel: menu numa só linha deslizante, fixo no topo; indicadores a duas colunas */
  nav{max-width:none;flex-basis:100%;padding:10px 16px;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
  .marca{flex-direction:row;align-items:baseline;gap:10px;padding:0} .marca b{font-size:18px} .marca span{font-size:12px}
  .menu{flex-direction:row;flex-wrap:nowrap;overflow-x:auto;gap:4px;margin:0 -16px;padding:0 16px;scrollbar-width:none}
  .menu::-webkit-scrollbar{display:none}
  .menu a{flex:0 0 auto;white-space:nowrap;min-height:40px;padding:0 12px;font-size:14px}
  .rodape{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:0;padding:0;font-size:12px;gap:8px}
  .rodape br{display:none} .rodape b{margin-left:4px} #prox{display:none}
  main{padding:18px 16px 40px;gap:18px} h1{font-size:26px} h2{font-size:18px}
  .grelha{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px}
  .cartao{padding:16px} .kpi{padding:12px 14px} .kpi .n{font-size:20px} .kpi .d{font-size:12px}
  .poco span{font-size:17px} .quatro{gap:8px}
  .form{grid-template-columns:1fr} .linha2{gap:14px} .linha2>*{flex-basis:100%}
  .seg button,.ctl{min-height:44px}
  dl{grid-template-columns:1fr;gap:2px 0} dd{margin-bottom:10px}
}
</style>
</head>
<body>


<div class="app">
<nav aria-label="Menu principal">
  <div class="marca"><b>We Garden</b><span>Painel da Administração</span></div>
  <div class="menu" id="menu"></div>
  <div class="rodape">
    <div>Última atualização<br><b id="ult">a carregar…</b></div>
    <div id="prox">Atualiza todos os dias de manhã.</div>
    <a href="#calculo" style="color:var(--noite-txt)">Como é calculado</a>
  </div>
</nav>
<main id="main"><div class="vazio">A carregar os dados…</div></main>
</div>
<div id="origem" hidden role="dialog" aria-label="Origem do valor"></div>

<script>
(function(){
'use strict';
var SP_RESUMO='https://wegarden.sharepoint.com/sites/Administrativo/Documentos%20Partilhados/Diversos/Resumo%20Financeiro%20di%C3%A1rio.xlsx';
var ECRAS=[['geral','Vista geral'],['tesouraria','Tesouraria'],['obras','Obras'],['pessoas','Pessoas e equipas'],['ferias','Férias'],['comercial','Comercial'],['manutencao','Manutenção'],['contabilidade','Contabilidade'],['salarios','Salários'],['objetivos','Objetivos'],['orcamento','Orçamento 2027'],['melhoria','Melhorar a empresa']];
var MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
var TIPOS={materiais:'Materiais e subempreitadas',pessoal:'Pessoal',transportes:'Transportes',estrutura:'Custos de estrutura',irc:'IRC'};
var E={mel:{},melMsg:'',melLv:'',melEst:'',orc:{},orcMsg:'',plan:{},mVista:'rent',manObra:{},cli:[],sal:{},cont:{},objs:{},dl:null,man:{},mAno:null,mEq:'',mLim:30,com:{},pipe:null,cAno:null,cq:'',cProg:'',cResp:'',cGrau:'',cLim:40,fed:[],fsel:null,fform:{},fmsg:'',fmsgErro:false,fLista:[],eqAbrir:false,eqr:{},eqmsg:'',apagar:null,apagarEq:null,pessoas:[],equipas:[],ferias:[],pv:'org',psel:null,rasc:null,pmsg:'',fMes:null,fTodos:false,fEq:'',nomes:{},uid:null,dias:[],obras:[],estados:{},obj:{},log:[],pronto:false,erro:null,podeEditar:false,periodo:90,fEstado:'Todas',fAno:'',sel:null};
var db=null,prov=[];

/* ---------- formatação ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function grp(i){return i.replace(/\B(?=(\d{3})+(?!\d))/g,' ')}
function eur(n,dec){if(n==null||isNaN(n))return 'sem dados';var d=dec==null?2:dec,s=Math.abs(n).toFixed(d).split('.');return (n<0?'−':'')+grp(s[0])+(d?','+s[1]:'')+' €'}
function eur0(n){return eur(n,0)}
function dif(n){if(n==null)return '—';if(Math.abs(n)<0.5)return 'sem alteração';return (n>0?'+':'−')+grp(Math.abs(n).toFixed(0))+' €'}
function pct(n){return n==null||!isFinite(n)?'sem dados':n.toFixed(1).replace('.',',')+' %'}
function pd(iso){var p=iso.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function dmy(iso){var p=iso.slice(0,10).split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function dm(iso){var p=iso.split('-');return p[2]+'/'+p[1]}
function iso(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function hora(ts){var d=new Date(ts);return isNaN(d)?'':dmy(iso(d))+' às '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
function semana(d){var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));var n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);var y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)}
function segunda(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}

/* ---------- origem dos valores ---------- */
function v(txt,p){prov.push(p);return '<button type="button" class="v" data-p="'+(prov.length-1)+'">'+esc(txt)+'</button>'}
function pDia(d,tit,cel,linha){return{tit:tit,fich:d.ficheiro||'Resumo Financeiro diário.xlsx',folha:d.folha,cel:cel,linha:linha,lido:d.lido_em,url:SP_RESUMO}}
function pCalc(tit,como,d){return{tit:tit,calc:como,fich:d&&'Resumo Financeiro diário.xlsx',folha:d&&d.folha,lido:d&&d.lido_em,url:d&&SP_RESUMO}}
function mostraOrigem(btn){
  var p=prov[+btn.dataset.p],o=document.getElementById('origem');if(!p)return;
  var de=[];
  if(p.calc)de.push(esc(p.calc));
  if(p.fich)de.push(esc(p.fich));
  if(p.folha)de.push('Folha '+esc(p.folha)+(p.linha?' · linha “'+esc(p.linha)+'”':'')+(p.cel?' · célula '+esc(p.cel):''));
  if(p.lido)de.push('Lido em '+esc(hora(p.lido)));
  o.innerHTML='<div class="et">Origem do valor</div><div class="ti">'+esc(p.tit)+'</div><div class="de">'+de.join('<br>')+'</div>'+(p.url?'<a href="'+esc(p.url)+'" target="_blank" rel="noopener">Abrir o ficheiro no SharePoint</a>':'');
  o.hidden=false;
  var r=btn.getBoundingClientRect(),w=o.offsetWidth,h=o.offsetHeight;
  var x=Math.min(Math.max(16,r.left),window.innerWidth-w-16),y=r.bottom+8;if(y+h>window.innerHeight-8)y=Math.max(8,r.top-h-8);
  o.style.left=x+'px';o.style.top=y+'px';
}
document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('.v');

/* ---------- cálculos de tesouraria ---------- */
function soma(l){return l.reduce(function(s,x){return s+(x.valor||0)},0)}
function bancoTotal(d){return soma(d.bancos)}
function porTipo(d,t){var l=d.pagar.filter(function(x){return x.tipo===t&&x.valor!=null});return l.length?soma(l):null}
function ultimo(){return E.dias[E.dias.length-1]}
function anterior(d,nd){var lim=iso(new Date(pd(d.data).getTime()-(nd||7)*864e5)),r=null;for(var i=0;i<E.dias.length;i++){if(E.dias[i].data<=lim)r=E.dias[i];else break}return r}
function tom(n,bom){return n==null||Math.abs(n)<0.5?'mute':((n>0)===bom?'ok':'warn')}
function estadoDe(o){var e=E.estados[o.codigo];return e&&e.estado||o.estado_proposto||'Em curso'}
function margem(o){return o.lucro!=null&&o.orcamento&&o.orcamento.valor?o.lucro/o.orcamento.valor*100:null}
function tomMargem(m){return m==null?'mute':m<10?'warn':m>=20?'ok':''}

/* ---------- gráficos ---------- */
function grafico(series,pts,minimo,rotulos){
  var W=1000,H=260,L=64,R=14,T=16,B=34,vals=[];
  pts.forEach(function(p){series.forEach(function(s){if(p[s.k]!=null)vals.push(p[s.k])})});
  if(minimo!=null)vals.push(minimo);
  if(!vals.length)return '<div class="vazio">Sem dados para este período.</div>';
  var mx=Math.max.apply(null,vals),mn=Math.min(0,Math.min.apply(null,vals));
  var passo=Math.pow(10,Math.floor(Math.log10((mx-mn)||1)));var nt=(mx-mn)/passo;if(nt<3)passo/=2;if(nt>7)passo*=2;
  var top=Math.ceil(mx/passo)*passo,bot=Math.floor(mn/passo)*passo;
  var t0=pd(pts[0].data).getTime(),t1=pd(pts[pts.length-1].data).getTime()||t0+1;
  function X(d){return pts.length<2?L+(W-L-R)/2:L+(pd(d).getTime()-t0)/((t1-t0)||1)*(W-L-R)}
  function Y(n){return T+(top-n)/((top-bot)||1)*(H-T-B)}
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(series.map(function(x){return x.nome}).join(' e '))+', de '+dmy(pts[0].data)+' a '+dmy(pts[pts.length-1].data)+'" style="width:100%;height:auto">';
  for(var g=bot;g<=top+1e-6;g+=passo){s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(g)+'" y2="'+Y(g)+'" stroke="var(--'+(Math.abs(g)<1e-6?'borda-ctl':'linha-fina')+')"/><text x="'+(L-8)+'" y="'+(Y(g)+4)+'" text-anchor="end" font-size="12">'+(Math.abs(g)>=1000?grp((g/1000).toFixed(0))+' k':g.toFixed(0))+'</text>'}
  if(minimo!=null)s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(minimo)+'" y2="'+Y(minimo)+'" stroke="var(--aviso-linha)" stroke-dasharray="6 5"/>';
  series.forEach(function(se){
    var p=pts.filter(function(x){return x[se.k]!=null});
    s+='<polyline fill="none" stroke="var(--'+se.cor+')" stroke-width="2.5" stroke-linejoin="round" points="'+p.map(function(x){return X(x.data).toFixed(1)+','+Y(x[se.k]).toFixed(1)}).join(' ')+'"/>';
    if(se.min&&minimo!=null)p.forEach(function(x){if(x[se.k]<minimo)s+='<circle cx="'+X(x.data)+'" cy="'+Y(x[se.k])+'" r="4" fill="var(--aviso-linha)"/>'});
    var u=p[p.length-1];if(u)s+='<circle cx="'+X(u.data)+'" cy="'+Y(u[se.k])+'" r="4" fill="var(--'+se.cor+')"/>';
  });
  var n=Math.min(rotulos||5,pts.length),vis={};
  for(var i=0;i<n;i++){var p=pts[Math.round(i*(pts.length-1)/Math.max(1,n-1))];if(vis[p.data])continue;vis[p.data]=1;var x=X(p.data);
    s+='<text x="'+x+'" y="'+(H-10)+'" text-anchor="'+(i===0&&n>1?'start':i===n-1&&n>1?'end':'middle')+'" font-size="12">'+(p.rot||dm(p.data))+'</text>'}
  return s+'</svg>';
}
function pontos(dias){return dias.map(function(d){return{data:d.data,banco:bancoTotal(d),final:d.saldo_final.valor}})}

/* ---------- ecrãs ---------- */
function semDados(){return '<div class="cartao"><div class="vazio">'+(E.erro?esc(E.erro):'Ainda não há dados carregados. A primeira sincronização preenche este ecrã.')+'</div></div>'}
function cabecalho(sobre,titulo,extra){return '<header class="topo"><div><div class="sobre">'+sobre+'</div><h1>'+titulo+'</h1></div>'+(extra||'')+'</header>'}
function kpi(rot,val,det,cls,barra){return '<div class="cartao kpi"><div class="sobre">'+rot+'</div><div class="n">'+val+'</div><div class="d '+(cls||'')+'">'+det+'</div>'+(barra!=null?'<div class="barra"><i style="width:'+Math.min(100,barra)+'%"></i></div>':'')+'</div>'}

  var ma=manAnos();if(ma.length){var md=E.man[ma.indexOf(new Date().getFullYear())>=0?new Date().getFullYear():ma[0]],ml=manLimite(),mb=(manAvencas(md)).filter(function(x){return x.margem!=null&&x.margem<ml}),mn=mb.filter(function(x){return x.margem<0}).length;

  var nr=porRever().length;if(nr)a.push(['Férias','info',nr+(nr===1?' entrada do mapa de férias por rever':' entradas do mapa de férias por rever'),'Ver a lista “Por rever” no ecrã Férias']);
  var l=E.log[0];

    if(ne)a.push(['Dados','aviso','Sincronização com '+ne+(ne===1?' erro':' erros'),esc(l.erros[0].fonte?l.erros[0].fonte+': ':'')+esc(l.erros[0].erro||l.erros[0])]);
    if(na)a.push(['Dados','info','Sincronização concluída com '+na+(na===1?' aviso':' avisos'),esc((l.avisos[0].folha?'Folha '+l.avisos[0].folha+': ':'')+(l.avisos[0].aviso||l.avisos[0]))+(na>1?' · e mais '+(na-1):'')])}
  return a;
}
function alertas(){
  var a=listaAlertas();
  if(!a.length)return '<div class="vazio">Sem alertas.</div>';
  return a.map(function(x){return '<div class="alerta"><span class="tag t-'+x[1]+'">'+x[0]+'</span><div><b>'+esc(x[2])+'</b><small>'+x[3]+'</small></div></div>'}).join('');
}

function tesouraria(){
  var u=ultimo();
  var per=[[30,'30 dias'],[90,'90 dias'],[365,'12 meses'],[0,'Desde 2024']];
  var h=cabecalho('Fonte: Resumo Financeiro diário.xlsx'+(u?' · última folha '+dmy(u.data):''),'Tesouraria','<div class="seg" role="group" aria-label="Período">'+per.map(function(p){return '<button type="button" data-per="'+p[0]+'" aria-pressed="'+(E.periodo===p[0])+'">'+p[1]+'</button>'}).join('')+'</div>');
  if(!u)return h+semDados();
  var ant=anterior(u),min=E.obj.saldo_minimo,nomeP=per.filter(function(p){return p[0]===E.periodo})[0][1].toLowerCase();
  var lim=E.periodo?iso(new Date(pd(u.data).getTime()-E.periodo*864e5)):'0',dias=E.dias.filter(function(d){return d.data>=lim});
  function antB(nome){if(!ant)return null;var x=ant.bancos.filter(function(b){return b.nome.trim().toLowerCase()===nome.trim().toLowerCase()})[0];return x?x.valor:null}
  var c='<section class="grelha" aria-label="Saldos por banco">';
  u.bancos.forEach(function(b){var a=antB(b.nome),d=a==null||b.valor==null?null:b.valor-a;
    c+=kpi(esc(b.nome),v(eur0(b.valor),pDia(u,b.nome+' · '+eur(b.valor),b.celula,b.nome)),d==null?'sem comparação':dif(d)+' face a '+dm(ant.data),d==null?'':tom(d,true))});
  var bt=bancoTotal(u),med=dias.reduce(function(s,d){return s+bancoTotal(d)},0)/dias.length,sf=u.saldo_final.valor;
  var prazo=soma(u.bancos.filter(function(b){return b.prazo}));
  c+=kpi('Saldo bancário total',v(eur0(bt),pCalc('Saldo bancário total · '+eur(bt),'Soma das linhas de “Saldos Bancários”',u)),'À ordem '+eur0(bt-prazo)+' · a prazo '+eur0(prazo)+' · média '+nomeP+' '+eur0(med));
  var ab=min==null?null:dias.filter(function(d){return d.saldo_final.valor<min}).length;
  c+=kpi('Saldo final',v(eur0(sf),pDia(u,'Saldo final · '+eur(sf),u.saldo_final.celula,'Saldo Final')),min==null?'Mínimo por definir (ver Objetivos)':ab?'Abaixo do mínimo em '+ab+(ab===1?' dia':' dias')+' ('+nomeP+')':'Sempre acima do mínimo ('+nomeP+')',ab?'warn':'');
  c+='</section>';
  var g='<section class="cartao" aria-label="Evolução do saldo"><div class="cab"><h2>Saldo bancário e saldo final · '+nomeP+'</h2><div class="legenda"><span><i style="background:var(--verde)"></i>Saldo bancário</span><span><i style="background:var(--serie2)"></i>Saldo final</span>'+(min!=null?'<span><i style="height:0;border-top:2px dashed var(--aviso-linha)"></i>Mínimo '+eur0(min)+'</span>':'')+'</div></div>'+grafico([{k:'banco',cor:'verde',nome:'Saldo bancário'},{k:'final',cor:'serie2',nome:'Saldo final',min:true}],pontos(dias),min,6)+'<div class="sobre">'+dias.length+' folhas no período.</div></section>';
  function achar(l,nome){return l.filter(function(x){return x.nome.trim().toLowerCase()===nome.trim().toLowerCase()})[0]}
  function lin(x,sec,sinal,bom){var a=ant&&achar(ant[sec],x.nome),d=a&&a.valor!=null&&x.valor!=null?x.valor-a.valor:null;
    return '<tr><td>'+esc(x.nome)+(sec==='receber'?' (a receber)':'')+'</td><td class="r">'+(x.valor==null?'<span class="mute">sem dados</span>':v(eur(sinal*x.valor),pDia(u,x.nome+' · '+eur(x.valor),x.celula,x.nome)))+'</td><td class="r '+tom(d,bom)+'">'+dif(d)+'</td></tr>'}
  var t='<section class="cartao" aria-label="Resumo do dia"><h2>Resumo de '+dmy(u.data)+'</h2><div class="rolo"><table style="min-width:420px"><thead><tr><th>Linha</th><th class="r">Valor</th><th class="r">Δ face a '+(ant?dm(ant.data):'—')+'</th></tr></thead><tbody>';
  t+=u.bancos.map(function(x){return lin(x,'bancos',1,true)}).join('')+u.receber.map(function(x){return lin(x,'receber',1,false)}).join('')+u.pagar.map(function(x){return lin(x,'pagar',-1,false)}).join('');
  var ds=ant?sf-ant.saldo_final.valor:null;
  t+='<tr class="total"><td>Saldo final</td><td class="r">'+v(eur(sf),pDia(u,'Saldo final · '+eur(sf),u.saldo_final.celula,'Saldo Final'))+'</td><td class="r '+tom(ds,true)+'">'+dif(ds)+'</td></tr></tbody></table></div>';
  var bate=Math.abs(sf-u.saldo_calculado)<0.005;
  t+='<div class="sobre '+(bate?'':'warn')+'">'+(bate?'Saldo final verificado: bancos + a receber − a pagar = valor da folha.':'Atenção: o saldo final da folha ('+eur(sf)+') difere do calculado ('+eur(u.saldo_calculado)+').')+'</div>';

function calculo(){
  return cabecalho('Definições dos indicadores','Como é calculado')+'<section class="cartao"><dl>'+
  '<dt>Saldo bancário total</dt><dd>Soma de todas as linhas do bloco “Saldos Bancários” da última folha do resumo financeiro, incluindo os depósitos a prazo.</dd>'+
  '<dt>Saldo final</dt><dd>Valor “Saldo Final” da última folha. É verificado contra o cálculo: bancos + a receber − todas as linhas de “Valor a Pagar”. Se divergir, aparece um aviso.</dd>'+
  '<dt>A pagar</dt><dd>Soma das linhas de “Valor a Pagar” da última folha. Cada linha é classificada pelo rótulo: fornecedores, impostos, salários, seguros ou outros.</dd>'+
  '<dt>Variação</dt><dd>Diferença face à folha mais recente com pelo menos 7 dias de distância da última.</dd>'+
  '<dt>Margem da obra</dt><dd>Lucro Total ÷ Orçamento Total, lidos do centro de custos da obra. Abaixo de 10 % aparece a laranja; a partir de 20 % a verde.</dd>'+
  '<dt>Margem média em curso</dt><dd>Soma dos lucros ÷ soma dos orçamentos das obras em curso.</dd>'+
  '<dt>Faturação da obra</dt><dd>Campo “Valor total faturado à Obra” do centro de custos. Vazio aparece como “não registado”, nunca como zero.</dd>'+
  '<dt>Estado da obra</dt><dd>Definido pela administração no ecrã Obras. Enquanto não for alterado, vale a proposta da sincronização.</dd>'+
  '<dt>Pessoas ausentes</dt><dd>Pessoas com um período de férias ou licença do mapa que cubra pelo menos um dia útil da semana, ou com o estado Férias ou Baixa na ficha.</dd><dt>Férias</dt><dd>As marcações feitas no painel juntam-se às lidas do mapa Excel e não são apagadas pela leitura diária; um período do mapa removido no painel fica escondido até ser reposto. Cada célula do mapa é convertida em períodos. O que não for interpretado com certeza aparece em “Por rever”, com o texto original; nada é descartado.</dd><dt>Comercial</dt><dd>Os mesmos números do separador Histórico da plataforma comercial. Propostas = enviadas + adjudicadas + perdidas. Taxa de adjudicação = adjudicadas ÷ (adjudicadas + perdidas), em número e em valor. “Em desenvolvimento” junta rascunhos e pastas de orçamento ainda sem proposta. Pedidos ativos = pedidos da pipeline que não estão “Fora de Zona” nem “Para rever”.</dd><dt>Melhorar a empresa</dt><dd>Sugestões tiradas de cinco livros (Profit First, Measure What Matters, The Lean Startup, The E-Myth Revisited e Blue Ocean Strategy). Os números dentro de cada sugestão são calculados na hora com os dados do painel. Receita real = volume de negócios − compras de materiais − subcontratos. Gastos fixos por mês = (pessoal + outros fornecimentos e serviços + outros gastos) ÷ meses fechados. O estado e as notas de cada sugestão são escritos pela administração.</dd><dt>Orçamento 2027</dt><dd>A coluna “Real” soma os balancetes do ano. A “Estimativa” junta esses meses com uma previsão dos que faltam: para a faturação, os mesmos meses do ano anterior ajustados pelo ritmo deste ano; compras e subcontratos na mesma percentagem da faturação; os outros gastos ao ritmo mensal do ano. A parte de manutenção é a carteira de avenças × 12 e o resto conta como obras. A “Sugestão” aplica à estimativa as percentagens escritas em cada rubrica. EBITDA = volume de negócios + outros rendimentos − compras − subcontratos − outros fornecimentos e serviços − pessoal − outros gastos. O orçamento e as metas são escritos pela administração e ficam guardados no painel.</dd><dt>Planeado e realizado</dt><dd>As horas planeadas vêm do calendário Teamup “Manutenções We Garden”: cada visita conta a sua duração, as visitas repetidas são expandidas para o ano todo e a Equipa Amarela (simulação) não conta. As horas realizadas vêm da folha de avenças e dos registos por obra. A comparação usa só os meses em que o cliente tem horas registadas e deixa de fora o mês em curso. Os nomes do Teamup são ligados aos da folha por semelhança; os casos duvidosos aparecem como “ligação provável”.</dd><dt>Manutenção por obra</dt><dd>O Templo, o MUO e o Monview não estão na folha de rentabilidade: as horas vêm dos registos mensais de pessoal das pastas de obra OB01_26, OB02_26 e OB02.2_26. Cada linha do registo é um dia de 8 horas de uma pessoa (ou as horas indicadas, como “4H”). O custo é a soma do custo por dia, das viaturas e dos terceiros indicados no ficheiro. A avença sem IVA é o valor da folha de cobranças dividido por 1,23.</dd><dt>Manutenção</dt><dd>Margem de uma avença = (avença × meses com horas registadas − custo das horas) ÷ receita. Meses sem horas não contam, e linhas sem horas em nenhum mês ficam fora das contas. Horas previstas = “Ideal N.º Horas Mensais” × meses com horas. “Em dívida” é a soma da coluna “Valor em Dívida” da folha de cobranças.</dd><dt>Clientes com vários nomes</dt><dd>Alguns clientes aparecem com nomes diferentes consoante a fonte (por exemplo Multiusos Oriente, MUO, Oriente Green Campus e OGC). O painel reconhece esses nomes e mostra o nome principal, o cliente e a equipa ao lado.</dd><dt>Salários</dt><dd>Lidos dos recibos de vencimento. O painel só guarda valores agregados: não há salários individuais, e os grupos com menos de 3 pessoas aparecem juntos. Bruto = total de remunerações dos recibos, incluindo o subsídio de alimentação. Quando há um recibo corrigido, vale o mais recente.</dd><dt>Contabilidade</dt><dd>Lida dos balancetes mensais. Rendimentos = contas 71 a 79; gastos = contas 61 a 69, somando as contas de movimento. Como a contabilidade não regista custo das mercadorias durante o ano, as compras do mês (conta 31) contam como gasto. EBITDA = rendimentos − gastos (sem depreciações nem juros suportados) − compras. Resultado = EBITDA − depreciações − juros suportados. Estes valores batem com o relatório de gestão da EWP.</dd><dt>Volume de negócios e EBITDA</dt><dd>Nos meses com balancete, o realizado vem da contabilidade. Valores mensais das folhas “Volume de negócios” e “EBITDA” do ficheiro de objetivos, preenchidas à mão a partir do relatório de gestão. Execução = ano corrente − objetivo, só nos meses fechados.</dd><dt>Objetivos</dt><dd>As metas vêm do ficheiro Objetivos.xlsx, lido todos os dias. A faturação de manutenção é uma estimativa (avença × meses com horas registadas); a projeção soma a faturação mensal das avenças aos meses que faltam. A projeção da faturação de obra é linear sobre o ano decorrido.</dd><dt>Desvio da obra</dt><dd>Chega com uma fase seguinte.</dd>'+
  '<dt>Valores em falta</dt><dd>Aparecem como “sem dados”. Uma célula vazia na origem nunca é mostrada como zero.</dd>'+
  '</dl></section>';
}

var IVA=1.23;
function contratosObra(d){
  // contratos acompanhados por pasta de obra (Templo, MUO, Monview): horas e custos dos registos mensais,
  // avença da folha de cobranças (que tem IVA) dividida por 1,23
  var doc=E.manObra[d.ano],out=[],hoje=new Date();if(!doc)return out;
  (doc.contratos||[]).forEach(function(c){
    var cfg=(E.cli||[]).filter(function(x){return (x.obras||[]).indexOf(c.codigo)>=0})[0];
    var cob=cfg&&(d.cobrancas||[]).filter(function(x){return cliConhecido(x.cliente)===cfg})[0];
    var M=(c.meses||[]).filter(function(m){return m.horas>0&&!(d.ano===hoje.getFullYear()&&m.mes===hoje.getMonth()+1)});
    if(!M.length)return;
    var av=cob&&cob.avenca!=null?cob.avenca/IVA:null,horas=[],custos=[],i;for(i=0;i<12;i++){horas.push(null);custos.push(null)}
    M.forEach(function(m){horas[m.mes-1]=m.horas;custos[m.mes-1]=m.custo});
    var custo=M.reduce(function(s,m){return s+m.custo},0),rec=av==null?null:av*M.length;
    out.push({cliente:(cfg?cfg.nome:c.nome),equipa:cfg&&cfg.equipa||null,avenca:av,ideal:null,horas:horas,custos:custos,n_meses:M.length,total_horas:M.reduce(function(s,m){return s+m.horas},0),receita:rec,custo:custo,margem:rec?(rec-custo)/rec*100:null,obra:c.codigo,contrato:c.nome,semAvenca:av==null});
  });
  return out;
}

var MEL_LIVROS={pf:['Profit First','Mike Michalowicz','Livro completo. Lidos em pormenor os capítulos sobre os princípios, as contas, as percentagens, o ritmo quinzenal, os clientes e as contratações.',
  'O lucro não deve ser o que sobra no fim do ano. Decide-se primeiro, separa-se logo que o dinheiro entra, e as despesas têm de caber no que fica. Para isso usa contas bancárias separadas por finalidade, um ritmo fixo de duas datas por mês e percentagens sobre a “receita real”, que é a faturação depois de tirar materiais e subcontratos.',
  'A We Garden tem muita faturação que só passa pela empresa (materiais e subcontratos), por isso a receita real é a medida certa. A tesouraria é folgada, o que permite aplicar o método sem aperto.',
  'As percentagens do livro vêm de empresas americanas e não devem ser copiadas. O livro trata dos impostos e da remuneração do dono de uma forma que não corresponde à lei portuguesa; essa parte deve ser vista com a contabilidade.'],
 okr:['Measure What Matters','John Doerr','Livro completo. Lidos em pormenor os capítulos sobre foco, alinhamento, acompanhamento e ambição, as conversas com as pessoas e os três anexos práticos.',
  'Poucos objetivos, escritos de forma clara, cada um com três a cinco resultados-chave mensuráveis, revistos todos os trimestres e visíveis para toda a gente. No fim de cada ciclo pontua-se, discute-se o que correu mal e recomeça-se. A avaliação das pessoas faz-se por conversas frequentes e não por uma reunião anual.',
  'O painel já mede quase tudo o que seria um resultado-chave. Falta escolher poucos objetivos, dar-lhes dono e revê-los com regularidade.',
  'Os exemplos são de empresas tecnológicas grandes. Numa empresa com cerca de trinta pessoas chega um nível de objetivos (empresa e equipas), sem objetivos individuais.'],
 ls:['The Lean Startup','Eric Ries (resumo)','O ficheiro é um resumo curto, que cobre só a primeira parte do livro: aprendizagem validada, experiências e métricas de vaidade.',
  'Antes de investir numa ideia, testa-se em pequeno com clientes reais e mede-se o resultado. O que conta é o que se aprende sobre o que o cliente quer e paga, e não o volume de atividade. Os números que só impressionam (as “métricas de vaidade”) escondem a falta de progresso.',
  'Serve para tudo o que é novo na empresa: mudanças de preço, serviços novos, novas formas de fazer propostas. Testar em cinco clientes antes de mudar em setenta.',
  'O livro foi escrito para empresas novas e de software. A We Garden tem um negócio conhecido; o método aplica-se às mudanças e não ao negócio inteiro.'],
 em:['The E-Myth Revisited','Michael E. Gerber (resumo)','O ficheiro é um resumo alargado, que cobre o livro todo.',
  'A maior parte das pequenas empresas é criada por um bom técnico que acaba a fazer tudo. A saída é trabalhar “na empresa como produto”: escrever a forma de fazer cada trabalho, organizar por funções e não por pessoas, e construir um sistema que dê sempre o mesmo resultado ao cliente, mesmo sem o dono presente.',
  'A manutenção é trabalho repetido em dezenas de clientes: é onde um método escrito rende mais. O painel já dá a parte de medir; falta a parte de fixar a forma de trabalhar.',
  'O modelo de franquia que o livro usa como exemplo não é o objetivo. A ideia de pessoal com o mínimo de qualificação não serve para jardinagem de qualidade; serve a ideia de método escrito.'],
 bo:['Blue Ocean Strategy','W. Chan Kim e Renée Mauborgne','Livro completo. Lidos em pormenor os instrumentos de análise, os seis caminhos, os não-clientes, a sequência utilidade-preço-custo-adoção e a parte da execução.',
  'Em vez de disputar os mesmos clientes com os mesmos argumentos, redesenha-se a oferta: tira-se o que o cliente não valoriza, reforça-se ou cria-se o que valoriza, e assim sobe o valor e desce o custo ao mesmo tempo. Usa quadros simples para comparar a oferta com a dos concorrentes e para procurar clientes fora do mercado habitual.',
  'A manutenção de jardins é um mercado onde quase todos oferecem o mesmo e competem pelo preço. Os quadros do livro ajudam a decidir em que é que a We Garden quer ser diferente.',
  'É o livro mais distante do dia a dia. As sugestões daqui são exercícios de reflexão para a administração, a fazer uma vez por ano, e as ideias concretas que dou são hipóteses a validar com clientes.']};
var MEL_EST=['Por decidir','Aceite','Em curso','Feita','Não se aplica'];
function melDados(){
  var D={},B=orcBase(),u=ultimo(),a=new Date().getFullYear(),md=E.man[a],sd=function(v,f){return v==null||!isFinite(v)?'sem dados':f(v)};
  D.sd=sd;D.ano=a;
  if(B){D.mes=MESES[B.n-1];D.vn=B.real.vn;D.pass=B.real.compras+B.real.subcontratos;D.rr=D.vn-D.pass;D.pessoal=B.real.pessoal;D.racio=D.pessoal?D.rr/D.pessoal:null;D.ebitda=B.ebitdaReal;D.ebRR=D.rr?D.ebitda/D.rr*100:null;D.ebVN=D.vn?D.ebitda/D.vn*100:null;D.fixosMes=(B.real.pessoal+B.real.fse_outros+B.real.outros_gastos)/B.n;D.sugEb=orcTot(B.sug)}
  if(u){D.saldo=u.saldo_final.valor;D.prazo=(u.bancos||[]).filter(function(b){return b.prazo}).reduce(function(t,b){return t+(b.valor||0)},0);D.mesesRes=D.fixosMes?D.saldo/D.fixosMes:null}
  if(md){var A=manAvencas(md).filter(function(x){return x.receita}),L=A.map(function(x){return {c:x.cliente,l:x.receita-x.custo,m:x.margem,ex:x.ideal?Math.max(0,x.total_horas-x.ideal*x.n_meses):0}}).sort(function(x,y){return y.l-x.l});
    var tot=L.reduce(function(t,x){return t+x.l},0),q=Math.max(1,Math.round(L.length/4));
    D.nAv=L.length;D.q=q;D.topQ=tot>0?L.slice(0,q).reduce(function(t,x){return t+x.l},0)/tot*100:null;D.fundoQ=tot>0?L.slice(-q).reduce(function(t,x){return t+x.l},0)/tot*100:null;
    D.neg=L.filter(function(x){return x.l<0}).length;D.ab25=L.filter(function(x){return x.m!=null&&x.m<25}).length;D.piores=L.slice(-5).reverse();D.melhores=L.slice(0,5);
    var EX=L.filter(function(x){return x.ex>0}).sort(function(x,y){return y.ex-x.ex}),te=EX.reduce(function(t,x){return t+x.ex},0);D.exTot=te;D.exN=EX.length;D.ex5=te?EX.slice(0,5).reduce(function(t,x){return t+x.ex},0)/te*100:null;D.divida=md.total_divida}
  var ci=E.com[a]&&E.com[a].itens;if(ci){D.K=comKpis(ci)}
  if(E.pipe)D.semResp=E.pipe.sem_responsavel;
  var od=objDoc();if(od)D.objSem=(od.linhas||[]).filter(function(l){return l.meta_anual==null}).length,D.objN=(od.linhas||[]).length;
  var P=md?planoLinhas(md):null;if(P){var eq={};P.linhas.forEach(function(x){if(x.plan==null||!x.plan)return;var e=x.equipa||'Sem equipa',z=eq[e]=eq[e]||{p:0,r:0};z.p+=x.plan;z.r+=x.real});D.eqR=Object.keys(eq).filter(function(e){return eq[e].p>50}).map(function(e){return {e:e,r:eq[e].r/eq[e].p}}).sort(function(x,y){return y.r-x.r});
    var rs=P.linhas.filter(function(x){return x.plan>=10}).map(function(x){return x.real/x.plan});if(rs.length){D.rMin=Math.min.apply(null,rs);D.rMax=Math.max.apply(null,rs)}}
  return D;
}
function melLista(D){
  var sd=D.sd,x1=function(n){return n.toFixed(1).replace('.',',')},L=[];
  function s(id,lv,conc,tit,pq,passo,medir,esf,ecra){L.push({id:id,lv:lv,conc:conc,tit:tit,pq:pq,passo:passo,medir:medir,esf:esf,ecra:ecra})}
  // Profit First
  s('pf1','pf','Receita real','Usar a receita real como medida de base','Até '+(D.mes||'—')+', a empresa faturou '+sd(D.vn,eur0)+', mas '+sd(D.pass,eur0)+' foram materiais e subcontratos que só passam pela empresa. A receita real, a que paga pessoal, estrutura e lucro, é '+sd(D.rr,eur0)+'. O EBITDA é '+sd(D.ebVN,pct)+' da faturação, mas '+sd(D.ebRR,pct)+' da receita real.','Passar a apresentar a receita real ao lado do volume de negócios nas reuniões da administração e usá-la como base das percentagens.','EBITDA ÷ receita real, todos os meses.','Baixo','contabilidade');
  s('pf2','pf','Lucro primeiro','Decidir o lucro antes de decidir as despesas','A fórmula do livro é vendas menos lucro igual a despesas. No orçamento de '+ORC_ANO+', a minha sugestão dá um EBITDA de '+(D.sugEb?sd(D.sugEb.ebitda,eur0):'sem dados')+', calculado no fim, como sobra. O método inverte a ordem: fixa-se a percentagem de resultado e os gastos têm de caber no resto.','No separador do orçamento, fixar primeiro a margem EBITDA pretendida e só depois ajustar as rubricas de gastos até caberem.','Margem EBITDA orçada e realizada, por trimestre.','Baixo','orcamento');
  s('pf3','pf','Contas separadas','Separar o dinheiro por finalidade','O livro usa contas bancárias distintas para lucro, impostos e despesas, para que o saldo da conta corrente mostre só o que se pode gastar. A empresa já tem depósitos a prazo ('+sd(D.prazo,eur0)+'), mas sem finalidade atribuída: reserva, impostos e lucro estão misturados.','Abrir, ou reservar, uma conta só para impostos (IVA, IRC, Segurança Social) e transferir para lá a parte correspondente sempre que entra dinheiro. A forma de o fazer deve ser combinada com a contabilidade.','Nunca faltar dinheiro na conta de impostos na data de pagamento.','Médio','tesouraria');
  s('pf4','pf','Ritmo fixo','Pagar a fornecedores em dois dias fixos por mês','O livro propõe os dias 10 e 25. Pagar sempre nas mesmas datas mostra o padrão das despesas, evita decidir pagamento a pagamento e dá previsibilidade aos fornecedores.','Experimentar durante dois meses: juntar os pagamentos em duas datas e avisar os fornecedores principais.','Número de pagamentos feitos fora das duas datas.','Baixo','tesouraria');
  s('pf5','pf','Reserva e cofre','Escrever as regras da reserva','O livro recomenda três meses de gastos de reserva e regras escritas, feitas com calma, para quando se toca nela. O saldo atual é '+sd(D.saldo,eur0)+', cerca de '+sd(D.mesesRes,x1)+' meses de gastos fixos ('+sd(D.fixosMes,eur0)+' por mês). Há folga acima dos três meses, mas não está decidido para que serve.','Decidir três valores: a reserva mínima intocável, o que fica para impostos e quanto do excedente vai para investimento ou distribuição.','Saldo mínimo definido como objetivo e nunca furado.','Baixo','tesouraria');
  s('pf6','pf','Pessoal e receita real','Medir o pessoal contra a receita real antes de contratar','A receita real é '+sd(D.racio,x1)+' vezes o custo do pessoal ('+sd(D.pessoal,eur0)+' até '+(D.mes||'—')+'). O livro aponta para 2,5 a 4 vezes em negócios de mão de obra. A referência é americana e não deve ser tomada à letra, mas a direção é clara: o rácio está baixo.','Calcular este rácio antes de cada contratação ou substituição, a começar pelas três saídas recentes.','Receita real ÷ custo do pessoal, por trimestre.','Baixo','salarios');
  s('pf7','pf','Clientes que dão prejuízo','Rever as piores avenças e procurar clientes iguais às melhores','O livro cita um estudo em que o quarto de clientes de topo gera mais do que todo o lucro e o quarto do fundo dá prejuízo. Na We Garden, as '+sd(D.q,String)+' melhores avenças (um quarto) geram '+sd(D.topQ,function(v){return v.toFixed(0)+' %'})+' do lucro da manutenção; '+sd(D.neg,String)+' dão prejuízo e '+sd(D.ab25,String)+' ficam abaixo de 25 % de margem.'+(D.piores?' As cinco com menos lucro acumulado este ano: '+D.piores.map(function(x){return esc(x.c)+' ('+(x.l<0?'−':'')+eur0(Math.abs(x.l))+')'}).join('; ')+'.':''),'Para cada uma das cinco piores, decidir uma de três saídas: subir o preço, reduzir as horas ou terminar o contrato. Em paralelo, descrever o que têm em comum as cinco melhores e procurar clientes desse tipo.','Número de avenças abaixo da margem mínima.','Médio','manutencao');
  // OKR
  s('okr0','okr','Quadro OKR','Adotar o quadro OKR a partir de janeiro de '+ORC_ANO,'Hoje os objetivos são metas anuais soltas, sem responsável, sem trimestres e sem pontuação: o ficheiro de objetivos tem '+sd(D.objSem,String)+' de '+sd(D.objN,String)+' linhas sem meta. O quadro OKR, explicado acima, junta numa página os poucos objetivos do trimestre, quem responde por cada um e como se mede. As outras sugestões deste livro são as regras para o usar bem.','Marcar para novembro uma reunião da administração de duas horas com um único ponto: escolher os três objetivos do primeiro trimestre de '+ORC_ANO+', os resultados-chave e os responsáveis. Com isso decidido, o quadro passa a existir no painel, ligado aos números.','Quadro do primeiro trimestre apresentado à empresa até meados de dezembro; revisão semanal feita em pelo menos dez das treze semanas; pontuação registada em abril.','Médio','objetivos');
  s('okr1','okr','Foco','Escolher três a cinco objetivos por trimestre','O livro insiste em poucos objetivos. Hoje o ficheiro de objetivos tem '+sd(D.objSem,String)+' de '+sd(D.objN,String)+' linhas sem meta, e o orçamento de '+ORC_ANO+' propõe dez metas. Dez é demais para dar foco.','Das metas de '+ORC_ANO+', escolher as três que mais importam no primeiro trimestre e comunicá-las a toda a empresa.','Três objetivos escritos e conhecidos por todos antes de janeiro.','Baixo','orcamento');
  s('okr2','okr','Resultados-chave','Escrever resultados, não tarefas','Um resultado-chave diz o que muda, com número e data; “analisar as avenças” é uma tarefa. Exemplo com dados do painel. Objetivo: todas as avenças rentáveis. Resultados-chave: avenças abaixo de 25 % de margem de '+sd(D.ab25,String)+' para metade; horas realizadas dentro das previstas; dívida de avenças ('+sd(D.divida,eur0)+') abaixo de um mês de faturação.','Reescrever cada objetivo escolhido com três resultados-chave que o painel já consiga medir.','Cada resultado-chave tem número, data e fonte no painel.','Baixo','objetivos');
  s('okr3','okr','Quantidade com qualidade','Juntar sempre uma medida de qualidade','O livro mostra o perigo de metas só de quantidade. Se a meta for só cortar horas, a qualidade do jardim cai e perde-se o cliente. Cada meta de custo deve ter ao lado uma de qualidade.','Escolher uma medida simples de qualidade para a manutenção: reclamações por mês, visitas do Teamup não realizadas ou avenças não renovadas.','A medida de qualidade não piora enquanto as horas descem.','Médio','manutencao');
  s('okr4','okr','Um dono por objetivo','Dar um responsável a cada objetivo e a cada pedido','Um objetivo sem dono não avança. O sinal mais visível está na parte comercial: '+sd(D.semResp,String)+' pedidos de orçamento sem responsável atribuído.','Atribuir um nome a cada objetivo do trimestre e limpar a lista de pedidos sem responsável.','Pedidos sem responsável: zero.','Baixo','comercial');
  s('okr5','okr','Acompanhar e pontuar','Revisão curta todas as semanas e pontuação no fim do trimestre','O ciclo do livro é: definir, acompanhar a meio, pontuar de 0 a 1 (verde acima de 0,7, amarelo entre 0,4 e 0,6, vermelho abaixo) e discutir o que mudar. Sem este ritmo, os objetivos ficam esquecidos no ficheiro.','Marcar 15 minutos por semana para ver os objetivos no painel e uma reunião no fim de cada trimestre para pontuar.','Reuniões realizadas e pontuação registada por trimestre.','Baixo','objetivos');
  s('okr6','okr','Conversas','Conversa mensal com cada chefe de equipa','O livro troca a avaliação anual por conversas regulares sobre objetivos, dificuldades e reconhecimento. As equipas trabalham de forma diferente: '+(D.eqR&&D.eqR.length?D.eqR.map(function(x){return esc(x.e)+' × '+x1(x.r)}).join(', ')+' (horas registadas face às do calendário)':'sem dados de comparação por equipa')+'. É matéria para conversar com quem está no terreno, não para concluir à distância.','Uma conversa por mês com cada chefe de equipa, com os números da equipa à frente.','Conversas realizadas por mês.','Médio','manutencao');
  s('okr7','okr','Ambição','Separar metas de compromisso e metas de ambição','O livro distingue as metas que têm de ser cumpridas a 100 % das que servem para puxar pela empresa, onde 70 % já é bom resultado. Misturar as duas leva a metas tímidas ou a frustração.','Marcar cada meta de '+ORC_ANO+' como compromisso (por exemplo, o saldo mínimo) ou ambição (por exemplo, a taxa de adjudicação).','Cada meta tem a sua classificação escrita.','Baixo','orcamento');
  // Lean
  s('ls1','ls','Experiências','Testar a atualização de preços em poucos clientes','O resumo defende testar barato e depressa antes de investir. A atualização de preços das avenças para '+ORC_ANO+' pode ser testada primeiro num grupo pequeno, para ver quantos aceitam e com que argumentos.','Escolher cinco avenças de margem baixa, propor o novo preço com uma explicação e registar a resposta.','Clientes que aceitam ÷ clientes contactados.','Baixo','manutencao');
  s('ls2','ls','Métricas de vaidade','Medir o que conta, não o que impressiona','O número de propostas enviadas impressiona mas não diz se a empresa ganha trabalho. '+(D.K?'Este ano há '+D.K.env+' propostas em “Enviado” sem resposta registada, contra '+D.K.adj+' adjudicadas e '+D.K.per+' perdidas. A taxa de adjudicação em valor ('+sd(D.K.taxaV,function(v){return v+' %'})+') assenta em muito poucas decisões.':'Sem dados comerciais carregados.'),'Fechar na plataforma as propostas antigas: ganha, perdida ou sem resposta ao fim de um prazo combinado.','Propostas em “Enviado” há mais de 60 dias.','Médio','comercial');
  s('ls3','ls','Aprendizagem validada','Registar o motivo de cada proposta perdida','O que se aprende com o cliente é o resultado que conta. Hoje uma proposta perdida fica sem explicação, e por isso não se sabe se o problema é o preço, o prazo ou a forma de apresentar.','Acrescentar um campo “motivo” na plataforma comercial e preenchê-lo sempre, com um telefonema ao cliente quando for preciso.','Propostas perdidas com motivo registado.','Baixo','comercial');
  s('ls4','ls','Produto mínimo','Lançar serviços novos com três clientes','Antes de comprar equipamento ou contratar para um serviço novo, oferece-se uma versão simples a poucos clientes e vê-se se pagam por ela.','Escolher um serviço novo (ver as ideias do Blue Ocean), oferecê-lo a três clientes de avença durante três meses e decidir depois.','Clientes que pagam pelo serviço no fim do teste.','Médio','manutencao');
  s('ls5','ls','Ajustar o rumo','Rever o orçamento todos os trimestres','O resumo compara gerir uma empresa a conduzir um carro e não a lançar um foguetão: corrige-se pelo caminho. Um orçamento anual que não se revê é um foguetão.','No fim de cada trimestre de '+ORC_ANO+', comparar o realizado com o orçamento e decidir se se mantém, se corrige ou se muda de rumo.','Revisões trimestrais feitas.','Baixo','orcamento');
  // E-Myth
  s('em1','em','Manual de operações','Escrever como se faz uma visita de manutenção','O livro defende que todo o trabalho repetido deve estar escrito. Na manutenção, as horas registadas vão de '+sd(D.rMin,function(v){return '× '+x1(v)})+' a '+sd(D.rMax,function(v){return '× '+x1(v)})+' das horas do calendário, conforme o cliente. Tanta diferença sugere que cada visita é feita à maneira de quem lá está.','Escrever uma folha por tipo de jardim: tarefas, ordem, tempo esperado, material e o que fica registado no fim. Começar pela equipa com mais clientes.','Clientes com folha de visita escrita.','Médio','manutencao');
  s('em2','em','Funções, não pessoas','Descrever cada função com as suas responsabilidades','O livro propõe um organigrama por funções, com o resultado esperado de cada uma, mesmo que a mesma pessoa ocupe várias. O painel já tem pessoas e equipas, mas não o que cada função responde.','Para cada caixa do organigrama, escrever três linhas: resultado esperado, o que decide sozinha e a quem responde.','Funções com descrição escrita.','Médio','pessoas');
  s('em3','em','Trabalhar na empresa','A empresa a funcionar sem depender dos sócios','O teste do livro é imaginar que alguém compra a empresa e ela tem de funcionar sem o dono. O que hoje só anda quando um sócio pega nele é o que falta sistematizar.','Listar as decisões que nas últimas duas semanas tiveram de passar por um sócio e escolher três para delegar com regras escritas.','Decisões do dia a dia que passam pelos sócios.','Alto','pessoas');
  s('em4','em','Inovar, medir, fixar','Cada melhoria é medida e depois passa a regra','O ciclo do livro tem três passos: experimentar uma forma melhor, medir o efeito com números e, se resultar, torná-la a forma obrigatória de trabalhar. É o que liga este separador ao resto do painel.','Usar este separador como registo: cada sugestão aceite tem um número antes, um número depois e uma decisão.','Sugestões marcadas como feitas, com resultado anotado.','Baixo','melhoria');
  s('em5','em','Serviço previsível','O cliente recebe sempre o mesmo','O livro dá muito peso à ordem e à previsibilidade: o cliente deve saber o que esperar em cada visita, de qualquer equipa.','Definir o que é igual em todas as visitas: dia e hora combinados, apresentação da equipa e uma mensagem curta ao cliente no fim.','Visitas com mensagem de fim de visita enviada.','Médio','manutencao');
  // Blue Ocean
  s('bo1','bo','Quadro estratégico','Desenhar a curva de valor da manutenção','O instrumento central do livro compara, num gráfico, quanto cada empresa oferece em cada fator que conta para o cliente. Quando as curvas são iguais, só sobra competir pelo preço.','Numa reunião de duas horas, listar seis a oito fatores (preço, frequência, tempo de resposta, comunicação, qualificação da equipa, serviços incluídos) e pontuar a We Garden e dois concorrentes.','Curva de valor desenhada e discutida.','Baixo',null);
  s('bo2','bo','Eliminar, reduzir, aumentar, criar','Decidir o que tirar e o que acrescentar à oferta','O livro faz quatro perguntas: o que eliminar, o que reduzir, o que aumentar e o que criar. Hipóteses a validar com clientes: reduzir visitas de rotina onde o jardim não precisa; aumentar a comunicação com o cliente; criar um relatório periódico com fotografias.','Preencher a grelha das quatro ações para a manutenção e testar uma ideia de cada coluna.','Uma ideia testada por coluna.','Médio',null);
  s('bo3','bo','Serviços complementares','Vender a solução inteira para o espaço exterior','O livro manda olhar para o que o cliente precisa antes, durante e depois do serviço. Quem contrata manutenção quer o espaço exterior resolvido: rega, iluminação, limpezas, podas em altura, pequenas reparações.','Perguntar a dez clientes de avença que outros serviços contratam a terceiros para o mesmo espaço.','Faturação de serviços adicionais a clientes de avença.','Médio','manutencao');
  s('bo4','bo','Cadeia de compradores','Falar com quem decide, não só com quem usa','Quem paga, quem usa e quem influencia são muitas vezes pessoas diferentes. Nos condomínios decide o administrador; nos edifícios de empresas decide o gestor de instalações, como a CBRE no Multiusos Oriente. Cada um valoriza coisas diferentes.','Para os dez maiores clientes, identificar quem decide a renovação e o que essa pessoa precisa de receber: relatório, fatura simples, um só contacto.','Clientes com o decisor identificado.','Baixo','comercial');
  s('bo5','bo','Não-clientes','Procurar quem ainda não é cliente','O livro distingue três grupos: os que estão quase a sair, os que recusam o serviço e os que nunca o consideraram. Para a We Garden: clientes de obra que não ficaram com avença, quem trata do jardim por conta própria e quem acha a manutenção profissional cara.','Listar as obras terminadas nos últimos dois anos sem contrato de manutenção e propor uma avença a cada uma.','Obras terminadas que passam a avença.','Médio','obras');
  s('bo6','bo','Pontos quentes','Concentrar o esforço onde o desvio é maior','Na parte da execução, o livro defende pôr os recursos nos poucos pontos que causam a maior parte do problema. Nas avenças com horas previstas, '+sd(D.exN,String)+' gastam mais do que o previsto, num total de '+sd(D.exTot,horas)+'; as cinco piores concentram '+sd(D.ex5,function(v){return v.toFixed(0)+' %'})+' desse excesso.','Tratar primeiro essas cinco avenças, em vez de pedir a todas as equipas que reduzam horas.','Horas acima do previsto nas cinco avenças.','Baixo','manutencao');
  s('bo7','bo','Processo justo','Envolver as equipas nas mudanças','O livro mostra que as pessoas aceitam melhor uma decisão quando foram ouvidas, quando lhes explicam porquê e quando sabem o que se espera delas. Vale para qualquer mudança deste separador que mexa com as equipas.','Antes de mudar a forma de trabalhar de uma equipa, apresentar-lhe os números, pedir a opinião e explicar a decisão final.','Mudanças apresentadas às equipas antes de entrarem em vigor.','Baixo','pessoas');
  return L;
}

function melOkrExplica(D){

    '</tbody></table></div>';
  var ciclo='<div class="rolo"><table><tbody>'+

    li('Meados de dezembro','Fecha os resultados-chave e os responsáveis e apresenta o quadro a toda a empresa.')+
    li('Primeira semana de janeiro','Cada chefe de equipa diz o que a sua equipa vai fazer para cada resultado-chave que lhe toca.')+
    li('Todas as semanas','Quinze minutos em frente ao quadro: o que mexeu, o que está parado, o que precisa de ajuda. Não se discutem culpas.')+
    li('Meados de fevereiro','Revisão a meio. Um resultado-chave que deixou de fazer sentido pode ser mudado ou retirado, dizendo porquê.')+
    li('Primeira semana de abril','Pontuar, discutir o que correu bem e mal, e abrir o quadro do segundo trimestre.')+

  var fl='<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px"><div class="seg" role="group" aria-label="Livro"><button type="button" data-mlv="" aria-pressed="'+(!E.melLv)+'">Todos</button>'+Object.keys(MEL_LIVROS).map(function(q){return '<button type="button" data-mlv="'+q+'" aria-pressed="'+(E.melLv===q)+'">'+MEL_LIVROS[q][0]+'</button>'}).join('')+'</div><div class="seg" role="group" aria-label="Estado"><button type="button" data-mest="" aria-pressed="'+(!E.melEst)+'">Todos os estados</button>'+MEL_EST.map(function(e){return '<button type="button" data-mest="'+e+'" aria-pressed="'+(E.melEst===e)+'">'+e+' · '+cont[e]+'</button>'}).join('')+'</div></div>';
  function cartao(x){var e=est(x),nota=(I[x.id]&&I[x.id].nota)||'';

  var corpo=Object.keys(MEL_LIVROS).filter(function(q){return !E.melLv||E.melLv===q}).map(function(q){var b=MEL_LIVROS[q],it=L.filter(function(x){return x.lv===q&&(!E.melEst||est(x)===E.melEst)});
    if(E.melEst&&!it.length)return '';
    return '<section class="cartao" style="background:var(--erva)" aria-label="'+b[0]+'"><div class="sobre">'+b[1]+'</div><h2>'+b[0]+'</h2><p><b>O que defende.</b> '+b[3]+'</p><p><b>O que serve à We Garden.</b> '+b[4]+'</p><p><b>Limites.</b> '+b[5]+'</p><div class="sobre">O que li: '+b[2]+'</div></section>'+(q==='okr'&&!E.melEst?melOkrExplica(D):'')+it.map(cartao).join('')}).join('');
  return h+k+ini+fl+(corpo||'<div class="cartao"><div class="vazio">Nenhuma sugestão neste estado.</div></div>');
}

  b=e.target.closest('[data-fconf]');if(b&&db){confirmarFerias(E.fLista[+b.dataset.fconf]).then(function(){E.fmsg='Confirmado.';E.fmsgErro=false;render(true)},function(){E.fmsg='Não foi possível confirmar.';E.fmsgErro=true;render(true)});return}
  b=e.target.closest('[data-frepor]');if(b&&db){db.doc('ferias_edicoes/'+b.dataset.frepor).delete().then(function(){render(true)},function(){});return}
  b=e.target.closest('[data-frev]');if(b&&db){edicao({acao:'revisto',chave:b.dataset.frev}).then(function(){render(true)},function(){});return}
  b=e.target.closest('[data-fn]');if(b){abrirFerias(b.dataset.fn,E.podeEditar?b.dataset.fd:null);render(true);var pf=document.getElementById('painel-ferias');if(pf&&pf.scrollIntoView)pf.scrollIntoView({block:'nearest',behavior:'smooth'});return}
  if(e.target.id==='p-nova'){E.psel=null;E.pmsg='';E.rasc={estado:'ativo',cargo:'membro'};render(true);return}
  if(e.target.id==='p-cancelar'){if(E.psel)abrirFicha(E.psel);else E.rasc=null;render(true);return}
  if(e.target.id==='p-guardar'){guardarFicha();return}
});
document.getElementById('main').addEventListener('change',function(e){
  var od=e.target.dataset||{};
  if(od.melest||od.melnota){
    var mi=Object.assign({},(E.mel&&E.mel.itens)||{}),mk=od.melest||od.melnota,mo=Object.assign({},mi[mk]||{});
    if(od.melest)mo.estado=e.target.value;else mo.nota=e.target.value.trim();
    mo.em=new Date().toISOString();mi[mk]=mo;E.mel=Object.assign({},E.mel,{itens:mi});melGravar();
    setTimeout(function(){var a=document.activeElement,id=a&&a.id;render(true);if(id){var el=document.getElementById(id);if(el)el.focus()}},0);
    return;
  }
  if(od.ol||od.om){
    var cx=od.ol?'linhas':'metas',kk=od.ol||od.om,nv=orcNum(e.target.value),m2=Object.assign({},E.orc[cx]||{});
    if(nv==null)delete m2[kk];else m2[kk]=nv;
    E.orc=Object.assign({},E.orc);E.orc[cx]=m2;orcGravar();
    setTimeout(function(){var a=document.activeElement,id=a&&a.id;render(true);if(id){var el=document.getElementById(id);if(el&&el.tagName==='INPUT'){el.focus();try{el.select()}catch(x){}}}},0);
    return;
  }
  if(e.target.id==='f-ano'){E.fAno=e.target.value;E.sel=null;render(true);return}
  if(e.target.id==='f-eq'){E.fEq=e.target.value;render(true);return}
  if(e.target.dataset&&e.target.dataset.f&&E.rasc){E.rasc[e.target.dataset.f]=e.target.value;return}
  if(e.target.dataset&&e.target.dataset.cf){E[e.target.dataset.cf]=e.target.value;E.cLim=40;render(true);return}
  if(e.target.id==='ff-nome'){E.fsel=e.target.value;render(true);return}
  if(e.target.dataset&&e.target.dataset.ff){E.fform[e.target.dataset.ff]=e.target.type==='checkbox'?e.target.checked:e.target.value;return}
  if(e.target.dataset&&e.target.dataset.ef){var q=e.target.dataset.eq;E.eqr[q]=Object.assign({},equipa(q)||{cor:'#91B03E',ramo:'manutencao'},E.eqr[q]||{});E.eqr[q][e.target.dataset.ef]=e.target.value;return}
  if(e.target.id==='estado-obra'&&db&&E.sel){
    var cod=E.sel,novo=e.target.value,msg=document.getElementById('estado-msg');msg.textContent='A guardar…';
    db.doc('obras_estado/'+cod).set({estado:novo,alterado_em:new Date().toISOString(),origem:'administração'}).then(function(){},function(){msg.textContent='Não foi possível guardar. Tente outra vez.';msg.className='sobre warn'});
  }
});

/* ---------- dados ---------- */
function arranque(){
  render();
  if(!window.claude||!window.claude.use){E.erro='Abra o painel no claude.ai para ver os dados.';render();return}
  window.claude.use('downloads').then(function(d){E.dl=d;render()},function(){});
  Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
    db=r[0];var user=r[1];
    if(!db){E.erro='A base de dados do painel não está disponível nesta vista.';render();return}
    Promise.resolve(user?user.canEdit():false).then(function(c){E.podeEditar=!!c;render()},function(){});
    var falha=function(){E.erro='Não foi possível ler os dados. Recarregue a página.';render()};
    db.collection('tesouraria').onSnapshot(function(s){var d=[];s.docs.forEach(function(x){var y=x.data();(y.dias||[]).forEach(function(z){d.push(Object.assign({},z,{lido_em:y.lido_em,ficheiro:y.ficheiro}))})});d.sort(function(a,b){return a.data<b.data?-1:1});E.dias=d;E.pronto=true;render()},falha);
    db.collection('obras').onSnapshot(function(s){E.obras=s.docs.map(function(x){return x.data()});render()},falha);
    db.collection('obras_estado').onSnapshot(function(s){var m={};s.docs.forEach(function(x){m[x.id]=x.data()});E.estados=m;render()},falha);
    db.collection('melhoria').onSnapshot(function(s){s.docs.forEach(function(x){if(x.id==='estado')E.mel=Object.assign({},x.data())});render()},falha);
    db.collection('orcamento').onSnapshot(function(s){s.docs.forEach(function(x){if(x.id===String(ORC_ANO))E.orc=Object.assign({},x.data())});render()},falha);
    db.collection('planeamento').onSnapshot(function(s){var m={};s.docs.forEach(function(x){m[x.id]=x.data()});E.plan=m;render()},falha);
    db.collection('manutencao_obra').onSnapshot(function(s){var m={};s.docs.forEach(function(x){m[x.id]=x.data()});E.manObra=m;render()},falha);
    db.doc('config/clientes').onSnapshot(function(s){E.cli=s.exists?(s.data().clientes||[]):[];render()},falha);
    db.collection('salarios').onSnapshot(function(s){var m={};s.docs.forEach(function(x){m[x.id]=x.data()});E.sal=m;render()},falha);
    db.collection('contabilidade').onSnapshot(function(s){var m={};s.docs.forEach(function(x){m[x.id]=x.data()});E.cont=m;render()},falha);
    db.collection('objetivos').onSnapshot(function(s){var m={};s.docs.forEach(function(x){m[x.id]=x.data()});E.objs=m;objRecalc();render()},falha);
    db.collection('pessoas').onSnapshot(function(s){E.pessoas=s.docs.map(function(x){return Object.assign({id:x.id},x.data())});
      var ids={};E.pessoas.forEach(function(p){(p.historico||[]).forEach(function(h){if(h.quem&&!(h.quem in E.nomes))ids[h.quem]=1})});ids=Object.keys(ids);
      if(user&&ids.length)user.profiles(ids).then(function(ps){ids.forEach(function(i){E.nomes[i]=(ps[i]&&ps[i].name)||''});render()},function(){});
      render()},falha);
    db.collection('equipas').onSnapshot(function(s){E.equipas=s.docs.map(function(x){return Object.assign({id:x.id},x.data())});render()},falha);
    db.collection('manutencao').onSnapshot(function(s){var m={};s.docs.forEach(function(x){m[x.id]=x.data()});E.man=m;render()},falha);
    db.collection('comercial').onSnapshot(function(s){var c={},pp=null;s.docs.forEach(function(x){if(x.id==='pipeline')pp=x.data();else c[x.id]=x.data()});E.com=c;E.pipe=pp;render()},falha);
    db.collection('ferias_edicoes').onSnapshot(function(s){E.fed=s.docs.map(function(x){return Object.assign({id:x.id},x.data())});render()},falha);
    db.collection('ferias').onSnapshot(function(s){E.ferias=s.docs.map(function(x){return x.data()});render()},falha);
    if(user&&user.id)Promise.resolve(user.id()).then(function(i){E.uid=i},function(){});
    db.collection('sync_log').orderBy('quando','desc').limit(5).onSnapshot(function(s){E.log=s.docs.map(function(x){return x.data()});render()},falha);
  });
}
arranque();
})();
</script>
